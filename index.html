<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thai Banknote Recognition System</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; }
        video { width: 100%; max-width: 600px; }
        #loading { display: none; }
    </style>
</head>
<body>
    <h1>Thai Banknote Recognition System</h1>
    <video id="video" autoplay></video>
    <canvas id="canvas" style="display:none;"></canvas>
    <div id="loading">Loading model...</div>
    <div id="result"></div>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-layers@latest"></script>
    <script>
        const modelURL = "https://teachablemachine.withgoogle.com/models/smarteye/model.json";
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const resultDiv = document.getElementById('result');
        const loadingDiv = document.getElementById('loading');
        let model, isLoading = true;

        async function initCamera() {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            video.srcObject = stream;
        }

        async function loadModel() {
            loadingDiv.style.display = 'block';
            model = await tf.loadLayersModel(modelURL);
            loadingDiv.style.display = 'none';
            isLoading = false;
            recognizeBanknote();
        }

        async function recognizeBanknote() {
            if (isLoading) return;
            const prediction = await getPrediction();
            displayResult(prediction);
            requestAnimationFrame(recognizeBanknote);
        }

        async function getPrediction() {
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const img = tf.browser.fromPixels(canvas);
            const reshaped = img.expandDims(0).toFloat().div(tf.scalar(255));
            const predictions = await model.predict(reshaped).data();
            return predictions;
        }

        function displayResult(predictions) {
            const classes = ["20 baht", "50 baht", "100 baht", "500 baht", "1000 baht", "not banknote"];  
            const confidenceThreshold = 0.85;
            let maxIndex = predictions.indexOf(Math.max(...predictions));
            let confidence = predictions[maxIndex];

            if (confidence > confidenceThreshold) {
                resultDiv.innerHTML = `Recognized: ${classes[maxIndex]} with confidence: ${(confidence * 100).toFixed(2)}%`;
                speak(classes[maxIndex]);
            } else {
                resultDiv.innerHTML = 'Not a valid banknote';
            }
        }

        function speak(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'th-TH';
            window.speechSynthesis.speak(utterance);
        }

        window.onload = () => {
            initCamera();
            loadModel();
        };
    </script>
</body>
</html>
