<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thai Banknote Recognition System</title>
    <link rel="stylesheet" href="styles.css"> <!-- Responsive Styles -->
</head>
<body>
    <h1>Thai Banknote Recognition System</h1>
    <video id="video" width="320" height="240" autoplay></video>
    <canvas id="canvas" width="320" height="240"></canvas>
    <div id="result"></div>
    <div id="confidence-alert" style="display: none;">ความไม่แน่นอนในการรู้จำสูง!</div>
    <div>
        <canvas id="barChart"></canvas>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://teachablemachine.withgoogle.com/models/YOUR_MODEL_NAME_HERE/model.js"></script>
    <script>
        // Video streaming setup
        navigator.mediaDevices.getUserMedia({ video: true })
            .then(stream => {
                const video = document.getElementById('video');
                video.srcObject = stream;
            });

        // Teachable Machine Integration
        const modelURL = "https://teachablemachine.withgoogle.com/models/YOUR_MODEL_NAME_HERE/";
        let model, maxPredictions;
        
        async function init() {
            const modelJson = modelURL + "model.json";
            model = await tmImage.load(modelJson, modelURL + "metadata.json");
            maxPredictions = model.getTotalClasses();
            requestAnimationFrame(predict);
        }
        
        async function predict() {
            const prediction = await model.predict(canvas);
            const sortedPredictions = prediction.sort((a, b) => b.probability - a.probability);
            
            const result = document.getElementById('result');
            result.innerHTML = sortedPredictions.map(p => `${p.className}: ${p.probability.toFixed(2)}`).join('<br>');
            
            if (sortedPredictions[0].probability < 0.5) {
                document.getElementById('confidence-alert').style.display = 'block';
            } else {
                document.getElementById('confidence-alert').style.display = 'none';
                // Speech synthesis
                const msg = new SpeechSynthesisUtterance(`คุณได้เลือก ${sortedPredictions[0].className}`);
                msg.lang = 'th-TH';
                window.speechSynthesis.speak(msg);
            }
            requestAnimationFrame(predict);
        }

        // Bar Chart Visualization
        function updateChart(data) {
            const ctx = document.getElementById('barChart').getContext('2d');
            const chart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: data.map(d => d.className),
                    datasets: [{
                        label: 'Recognition Confidence',
                        data: data.map(d => d.probability),
                        backgroundColor: 'rgba(75, 192, 192, 0.2)',
                        borderColor: 'rgba(75, 192, 192, 1)',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true
                }
            });
        }

        init();
    </script>
</body>
</html>
