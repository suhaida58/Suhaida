<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thai Banknote Recognition System</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-models/dist/coco-ssd"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        #webcam {
            width: 100%;
            height: auto;
            display: none;
        }
        #canvas {
            display: none;
        }
        .loading {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
        }
        @media (max-width: 600px) {
            body {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <h1>ระบบการจดจำธนบัตรไทย</h1>
    <video id="webcam" autoplay></video>
    <canvas id="canvas"></canvas>
    <div class="loading">Loading...</div>
    <div id="results"></div>
    <script>
        let confidenceThreshold = 0.85;
        const video = document.getElementById('webcam');
        const loading = document.querySelector('.loading');

        async function setupCamera() {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            video.srcObject = stream;
            return new Promise((resolve) => {
                video.onloadedmetadata = () => { resolve(video); };
            });
        }

        async function loadModel() {
            const model = await cocoSsd.load();
            return model;
        }

        async function recognize() {
            loading.style.display = 'block';
            const model = await loadModel();
            await setupCamera();
            video.play();
            loading.style.display = 'none';

            const detect = async () => {
                const predictions = await model.detect(video);
                processPredictions(predictions);
                requestAnimationFrame(detect);
            };
            detect();
        }

        function processPredictions(predictions) {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '';
            let confidenceAlertSound = new Audio('alert.mp3');

            predictions.forEach(prediction => {
                const { class: label, score } = prediction;
                if (score >= confidenceThreshold) {
                    resultsDiv.innerHTML += `<p>${label}: ${Math.round(score * 100)}%</p>`;
                } else if (score < confidenceThreshold) {
                    confidenceAlertSound.play();
                }
            });

            drawBarChart(predictions);
        }

        function drawBarChart(predictions) {
            const ctx = document.getElementById('canvas').getContext('2d');
            ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
            let labels = predictions.map(p => p.class);
            let data = predictions.map(p => p.score);

            // Here you can use Chart.js or any other library to draw the bar chart
            // Implementation can depend on your preference
        }

        recognize();
    </script>
</body>
</html>
