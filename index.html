<html lang="th">

        #loading { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); }
    </style>
</head>
<body>

    <div id="loading">โหลดข้อมูล...</div>

        <video id="video" width="720" height="560" autoplay></video>

        <button id="stopButton">หยุดกล้อง</button>
    </div>
    <div id="chartContainer">

    </div>
    <script>
        async function loadModel() {
            const model = await tf.loadGraphModel('https://teachablemachine.withgoogle.com/models/smarteye/model.json');
            return model;
        }
        function startCamera() {
            navigator.mediaDevices.getUserMedia({ video: true })
                .then((stream) => {
                    document.getElementById('video').srcObject = stream;
                });
        }
        function stopCamera() {
            const video = document.getElementById('video');
            const stream = video.srcObject;
            if (stream) {
                const tracks = stream.getTracks();
                tracks.forEach((track) => track.stop());
            }
            video.srcObject = null;
        }

        }
        async function init() {
            const model = await loadModel();
            document.getElementById('loading').style.display = 'none';
            startCamera();
            setInterval(() => classifyImage(model), 1000);
        }
        document.getElementById('startButton').addEventListener('click', () => { startCamera(); });
        document.getElementById('stopButton').addEventListener('click', () => { stopCamera(); });

</body>
</html>
